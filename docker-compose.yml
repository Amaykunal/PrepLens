services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: preplens, POSTGRES_PASSWORD: preplens, POSTGRES_DB: preplens }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://preplens:preplens@db:5432/preplens
    depends_on: [db]
    ports: ["8000:8000"]
volumes:
  pgdata:
